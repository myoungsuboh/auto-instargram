# 로컬 개발 인프라 (3_architecture.md §3 Data Layer: DB-01 Primary RDBMS / PostgreSQL)
#
# 사용법:  docker compose -f docker-compose.dev.yml up -d
# 정리:    docker compose -f docker-compose.dev.yml down -v
#
# SKL-SECRETS-MANAGEMENT 규칙 1·3: 비밀값은 하드코딩하지 않고 .env 에서 주입받으며,
# 누락 시 `${VAR:?...}` 문법으로 컨테이너가 뜨기 전에 즉시 실패(fail-fast)한다.

services:
  postgres:
    image: postgres:17-alpine
    container_name: auto-instargram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 가 .env 에 없습니다 (.env.example 을 복사하세요)}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 가 .env 에 없습니다 (.env.example 을 복사하세요)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없습니다 (.env.example 을 복사하세요)}
      # 한글 캡션(varchar) 정렬·비교를 위한 UTF-8 고정
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 호스트 포트 충돌 시 .env 의 POSTGRES_PORT 만 바꾸면 됨
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # run.sh / run.bat 이 "DB 준비 완료"를 판단하는 근거
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  postgres_data:
    name: auto-instargram-postgres-data
