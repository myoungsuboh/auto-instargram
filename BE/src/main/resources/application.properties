spring.application.name=backend

# ── 환경변수 주입 (SKL-SECRETS-MANAGEMENT 규칙 1: 시크릿은 밖에 두고 주입받는다) ──
# 프로젝트 루트의 .env 를 읽어온다. 파일이 없어도 기동은 시도하며,
# 그 경우 아래 필수 값이 비어 있어 시작 단계에서 즉시 실패한다(규칙 3: fail-fast).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ── 서버 (3_architecture.md SVC-02: Port 8080) ───────────────────────────
server.port=${SERVER_PORT:8080}
# POL-05: 에러 응답에 스택트레이스·내부 메시지를 노출하지 않는다
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ── 데이터베이스 (3_architecture.md DB-01 / Required env vars) ───────────
# 기본값을 주지 않으므로 값이 없으면 애플리케이션이 시작을 거부한다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# POL-04 (응답 3초 이내): 커넥션 대기로 인한 지연을 3초 안에서 끊는다
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=auto-instargram-pool

# ── JPA ─────────────────────────────────────────────────────────────────
# 스키마의 소유자는 Flyway 다. Hibernate 는 검증만 하고 절대 변경하지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ── Flyway 마이그레이션 ──────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Actuator (3_architecture.md SVC-02 Health check: /actuator/health) ───
management.endpoints.web.exposure.include=health,info
# POL-05: 헬스체크 응답으로 접속 정보·내부 구성이 새지 않게 한다
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ── 로깅 ────────────────────────────────────────────────────────────────
# POL-05: SQL 파라미터 바인딩 로그를 끈다 (토큰이 로그로 새는 대표 경로)
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.com.autoinstagram.backend=INFO

# ── 대시보드 로그인 / JWT (skills/security/JWT-authn-authz.md) ───────────
# 기본값을 주지 않는다 → JWT_SECRET 이 없으면 기동 거부 (fail-fast)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=auto-instargram
# 규칙 2: Access Token 만료는 15분 이하. 이 값을 늘리면 기동 시 검증에서 거부된다.
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d
# 규칙 1: httpOnly + Secure + SameSite=Strict.
#   httpOnly 는 코드에서 항상 true. Secure 는 HTTPS 가 아닌 로컬 개발에서 false 여야
#   브라우저가 쿠키를 보내므로 환경변수로 분리했다. 운영에서는 반드시 true.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=Strict

# ── 저장 시 토큰 암호화 (POL-05 / ENT-03 "암호화된 액세스 토큰") ──────────
# 기본값 없음 → 키가 없으면 기동 거부
app.credential.encryption-key=${CREDENTIAL_ENCRYPTION_KEY}

# ── Meta Instagram Graph API (3_architecture.md SVC-02 외부 의존성) ──────
app.instagram.graph-base-url=${INSTAGRAM_GRAPH_BASE_URL:https://graph.instagram.com}
# 비어 있어도 기동은 된다 — 인스타그램 연동만 비활성화되고 나머지 기능은 정상 동작
app.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET:}
# 버전이 필요한 엔드포인트(/me)에 붙이는 접두사. Meta 는 버전을 생략하면 가장 오래된
# 지원 버전으로 처리할 수 있어, 문서에 버전이 명시된 호출은 명시된 대로 보낸다.
app.instagram.api-version=${INSTAGRAM_API_VERSION:v25.0}
# POL-04(응답 3초 이내): 연결 + 응답 합계를 2.5초 이내로 잡는다
app.instagram.connect-timeout=800ms
app.instagram.read-timeout=1700ms

# ── CORS (3_architecture.md §4: FE → BE) ────────────────────────────────
# 화면과 API 가 포트가 달라 교차 출처다. 허용 출처를 반드시 특정한다 —
# 와일드카드(*)는 기동 시점에 거부된다 (쿠키 인증과 양립 불가 + CSRF 방어 약화, ADR-0006).
# 여러 개는 쉼표로 구분한다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── 전송 보안 (skills/security/HTTPS-transport-security.md) ───────────────
# HTTPS 강제 + HSTS. 로컬 개발(http)에서는 반드시 false 여야 한다 —
# true 로 두고 http 에 접속하면 브라우저가 이후 접속을 전부 https 로 강제해
# 로컬 개발이 불가능해진다(브라우저 설정을 직접 지워야 풀린다).
# ⚠️ 운영 배포 시 반드시 true. 그러지 않으면 인증 쿠키가 평문 전송된다.
app.security.https-enforced=${HTTPS_ENFORCED:false}

# ── 미디어 파일 (SKL-INPUT-VALIDATION 규칙 6: 허용 디렉터리 밖 경로 차단) ──
# 예약·업로드 요청의 mediaPath/binaryPath 는 이 디렉터리 안으로 제한된다.
# 상대 경로는 이 디렉터리 기준으로 해석되고, 밖을 가리키면 422 로 거부된다.
app.media.base-dir=${MEDIA_BASE_DIR:./storage/media}
# 바이너리 사전 검증 크기 범위 (기본 1KB ~ 1GB)
app.media.min-file-bytes=1024
app.media.max-file-bytes=1073741824

# ── 릴스 게시 (API-04 Story-06.1) ────────────────────────────────────────
# 인스타그램에 실제로 게시할지. false 면 검증·등록·이력까지만 동작하고
# 4단계 파이프라인은 "미구성" 오류로 중단한다 — 가짜 성공을 만들지 않기 위함이다.
app.instagram.publish-enabled=${INSTAGRAM_PUBLISH_ENABLED:false}
# 게시 대상 인스타그램 비즈니스 계정 ID (실제 게시에 필요)
app.instagram.user-id=${INSTAGRAM_USER_ID:}
# 명세 "게시 한도 확인" — Meta 공식 문서 기준 24시간당 100건
#   "Instagram accounts are limited to 100 API-published posts within a 24-hour moving period."
#   https://developers.facebook.com/docs/instagram-platform/content-publishing
app.instagram.max-publishes-per-day=100

# ── 예약 발행 실행기 (Story-01.2 "예약 실행") ─────────────────────────────
app.publish.worker-enabled=${PUBLISH_WORKER_ENABLED:true}
app.publish.worker-interval-ms=10000
# 기동 직후에는 마이그레이션·시드가 끝나야 하므로 조금 기다린다
app.publish.worker-initial-delay-ms=15000

# ── 초기 계정 시드 (00-ORCHESTRATOR Verify 2: seed idempotently) ─────────
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${SEED_ADMIN_USERNAME:}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.operator-username=${SEED_OPERATOR_USERNAME:}
app.seed.operator-password=${SEED_OPERATOR_PASSWORD:}
