spring.application.name=backend

# ── 환경변수 주입 (SKL-SECRETS-MANAGEMENT 규칙 1: 시크릿은 밖에 두고 주입받는다) ──
# 프로젝트 루트의 .env 를 읽어온다. 파일이 없어도 기동은 시도하며,
# 그 경우 아래 필수 값이 비어 있어 시작 단계에서 즉시 실패한다(규칙 3: fail-fast).
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# ── 서버 (3_architecture.md SVC-02: Port 8080) ───────────────────────────
server.port=${SERVER_PORT:8080}
# POL-05: 에러 응답에 스택트레이스·내부 메시지를 노출하지 않는다
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ── 데이터베이스 (3_architecture.md DB-01 / Required env vars) ───────────
# 기본값을 주지 않으므로 값이 없으면 애플리케이션이 시작을 거부한다.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# POL-04 (응답 3초 이내): 커넥션 대기로 인한 지연을 3초 안에서 끊는다
spring.datasource.hikari.connection-timeout=2500
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=auto-instargram-pool

# ── JPA ─────────────────────────────────────────────────────────────────
# 스키마의 소유자는 Flyway 다. Hibernate 는 검증만 하고 절대 변경하지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50

# ── Flyway 마이그레이션 ──────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Actuator (3_architecture.md SVC-02 Health check: /actuator/health) ───
management.endpoints.web.exposure.include=health,info
# POL-05: 헬스체크 응답으로 접속 정보·내부 구성이 새지 않게 한다
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ── 로깅 ────────────────────────────────────────────────────────────────
# POL-05: SQL 파라미터 바인딩 로그를 끈다 (토큰이 로그로 새는 대표 경로)
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off
logging.level.com.autoinstagram.backend=INFO
